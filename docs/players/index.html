<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        html {
            height: 100%;
            box-sizing: border-box;
        }

        *, *::before, *::after {
            box-sizing: inherit;
        }

        body {
            font-family: "IBM Plex Mono",
                         ui-monospace,
                         SFMono-Regular,
                         Menlo,
                         Monaco,
                         Consolas,
                         "Liberation Mono",
                         "Courier New",
                         monospace;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            min-height: 100%;
            margin: 0;
            padding: 14px 20px 20px 20px;

            background-color: black;
            color: white;

            font-size: 19px;
            line-height: 1.7;

            overflow-x: hidden;
        }

        @media (min-width: 768px) {
            body {
                padding: 28px 50px 50px 50px;
                font-size: 22px;
            }
        }

        .content {
            max-width: 600px;
            width: 100%;
            min-width: 0;
        }

        @media (min-width: 1024px) {
            .content {
                max-width: 900px;
            }
        }

        h1, h2, h3 {
            text-align: left;
            line-height: 1.2;
            margin: 0 0 0.45em 0;
        }

        h1 {
            font-size: 2em;
            font-weight: 700;
        }

        h2 {
            font-size: 1.5em;
            font-weight: 700;
            margin-top: 1.2em;
        }

        h3 {
            font-size: 1.25em;
            font-weight: 600;
            margin-top: 1em;
        }

        p {
            margin: 0 0 0.45em 0;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0 0 0.45em 0;
        }

        ul li {
            margin: 0.5em 0;
            text-indent: -1em;
            padding-left: 1em;
        }

        ul li::before {
            content: "* ";
        }

        a {
            color: white;
            text-decoration: underline;
        }

        a:hover {
            text-decoration: none;
        }

        hr {
            border: none;
            border-top: 1px solid #444;
            margin: 0.9em 0;
        }

        .season-nav-wrap {
            width: 100%;
            overflow-x: auto;
            margin: 0 0 1em 0;
            border-bottom: 1px solid #444;
            padding-bottom: 0.6em;
        }

        .season-nav {
            display: flex;
            gap: 0.8em;
            white-space: nowrap;
            min-width: max-content;
            font-size: 0.9em;
        }

        .season-nav a,
        .season-current {
            border: 1px solid #444;
            padding: 0.25em 0.55em;
            text-decoration: none;
        }

        .season-current {
            font-weight: 700;
            background-color: #1a1a1a;
        }

        .stat {
            border: 1px solid #444;
            border-radius: 0;
            padding: 0.8em 1em;
            margin: 0.8em 0 1em 0;
        }

        .stat-label {
            font-size: 0.85em;
            color: #ccc;
            margin-bottom: 0.2em;
        }

        .ranking-table {
            display: grid;
            grid-template-columns: 2ch minmax(5ch, 1fr) auto auto;
            column-gap: 0.7em;
            row-gap: 0.25em;
            align-items: baseline;
            margin: 0.4em 0 1em 0;
        }

        .rank-no {
            color: #ccc;
            text-align: right;
        }

        .rank-player {
            font-weight: 700;
        }

        .rank-score {
            text-align: right;
        }

        .rank-detail {
            color: #ccc;
            font-size: 0.9em;
        }

        .big-number {
            font-size: 2.4em;
            line-height: 1.1;
            font-weight: 700;
        }

        .small-detail {
            color: #ccc;
            font-size: 0.9em;
        }

        .up {
            color: #ff6b6b;
            font-weight: 700;
        }

        .down {
            color: #51cf66;
            font-weight: 700;
        }

        .flat {
            color: #ccc;
            font-weight: 700;
        }

        .meta {
            color: #ccc;
            font-size: 0.9em;
        }

        .table-scroll {
            width: 100%;
            overflow-x: auto;
            margin: 0.8em 0 1.2em 0;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.9em;
            min-width: max-content;
        }

        th, td {
            border-right: 1px solid #444;
            border-bottom: 1px solid #444;
            padding: 0.35em 0.45em;
            text-align: left;
            vertical-align: top;
            white-space: nowrap;
            background-color: black;
        }

        tr:first-child th {
            border-top: 1px solid #444;
        }

        th:first-child,
        td:first-child {
            border-left: 1px solid #444;
        }

        th {
            font-weight: 700;
        }

        table tbody th:first-child,
        table tbody td:first-child {
            position: sticky;
            left: 0;
            z-index: 2;
            background-color: black;
            box-shadow: 1px 0 0 #444;
        }

        table thead tr:first-child th:first-child {
            position: sticky;
            left: 0;
            z-index: 4;
            background-color: black;
            box-shadow: 1px 0 0 #444;
        }

        table thead tr:not(:first-child) th:first-child {
            position: static;
        }

        .shaded,
        table .shaded {
            background-color: #1a1a1a;
            color: #777;
        }

        .strong-total {
            font-weight: 700;
        }
    </style>
</head>
<body>

</tbody>
</table>
</div><p><a href="../index.html">Back to home</a></p>    </div>
</body>
</html>
