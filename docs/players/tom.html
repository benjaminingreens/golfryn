<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        html {
            height: 100%;
            box-sizing: border-box;
        }

        *, *::before, *::after {
            box-sizing: inherit;
        }

        body {
            font-family: "IBM Plex Mono",
                         ui-monospace,
                         SFMono-Regular,
                         Menlo,
                         Monaco,
                         Consolas,
                         "Liberation Mono",
                         "Courier New",
                         monospace;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            min-height: 100%;
            margin: 0;
            padding: 14px 20px 20px 20px;

            background-color: black;
            color: white;

            font-size: 19px;
            line-height: 1.7;

            overflow-x: hidden;
        }

        @media (min-width: 768px) {
            body {
                padding: 28px 50px 50px 50px;
                font-size: 22px;
            }
        }

        .content {
            max-width: 600px;
            width: 100%;
            min-width: 0;
        }

        @media (min-width: 1024px) {
            .content {
                max-width: 900px;
            }
        }

        h1, h2, h3 {
            text-align: left;
            line-height: 1.2;
            margin: 0 0 0.45em 0;
        }

        h1 {
            font-size: 2em;
            font-weight: 700;
        }

        h2 {
            font-size: 1.5em;
            font-weight: 700;
            margin-top: 1.2em;
        }

        h3 {
            font-size: 1.25em;
            font-weight: 600;
            margin-top: 1em;
        }

        p {
            margin: 0 0 0.45em 0;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0 0 0.45em 0;
        }

        ul li {
            margin: 0.5em 0;
            text-indent: -1em;
            padding-left: 1em;
        }

        ul li::before {
            content: "* ";
        }

        a {
            color: white;
            text-decoration: underline;
        }

        a:hover {
            text-decoration: none;
        }

        hr {
            border: none;
            border-top: 1px solid #444;
            margin: 0.9em 0;
        }

        .stat {
            border: 1px solid #444;
            border-radius: 0;
            padding: 0.8em 1em;
            margin: 0.8em 0 1em 0;
        }

        .stat-label {
            font-size: 0.85em;
            color: #ccc;
            margin-bottom: 0.2em;
        }

        .ranking-table {
            display: grid;
            grid-template-columns: 2ch minmax(5ch, 1fr) auto auto;
            column-gap: 0.7em;
            row-gap: 0.25em;
            align-items: baseline;
            margin: 0.4em 0 1em 0;
        }

        .rank-no {
            color: #ccc;
            text-align: right;
        }

        .rank-player {
            font-weight: 700;
        }

        .rank-score {
            text-align: right;
        }

        .rank-detail {
            color: #ccc;
            font-size: 0.9em;
        }

        .big-number {
            font-size: 2.4em;
            line-height: 1.1;
            font-weight: 700;
        }

        .small-detail {
            color: #ccc;
            font-size: 0.9em;
        }

        .up {
            color: #ff6b6b;
            font-weight: 700;
        }

        .down {
            color: #51cf66;
            font-weight: 700;
        }

        .flat {
            color: #ccc;
            font-weight: 700;
        }

        .meta {
            color: #ccc;
            font-size: 0.9em;
        }

        .table-scroll {
            width: 100%;
            overflow-x: auto;
            margin: 0.8em 0 1.2em 0;
        }

        table {
            border-collapse: collapse;
            font-size: 0.9em;
            min-width: max-content;
        }

        th, td {
            border: 1px solid #444;
            padding: 0.35em 0.45em;
            text-align: left;
            vertical-align: top;
            white-space: nowrap;
        }

        th {
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="content">
<h1>Tom</h1>

<h2>Average vs Par</h2>

<div class="stat">
    <div class="stat-label">Tom</div>
    <div class="big-number">0.00 <span class="flat">■</span></div>
    <div class="small-detail">overall 0</div>
    <div class="small-detail">1 games · 18 holes</div>
</div>
<h2>Shot Breakdown</h2>
<div class="table-scroll">
<table>
<thead>
<tr><th>Player</th><th>Over par holes</th><th>Par holes</th><th>Under par holes</th><th>Total shots</th><th>Total vs par</th></tr>
</thead>
<tbody>
<tr><td>Tom</td><td>3</td><td>8</td><td>7</td><td>57</td><td>0</td></tr>
<tr><th>Total</th><th>3</th><th>8</th><th>7</th><th>57</th><th>0</th></tr>
</tbody>
</table>
</div><h2>Games</h2>
<div class="table-scroll">
<table>
<thead>
<tr><th>Game</th><th>Date</th><th>Location</th><th>Total vs par</th><th>Average vs par</th><th>Total shots</th></tr>
</thead>
<tbody>
<tr><td><a href="../games/game_1.html">Game 1</a></td><td>20260509</td><td>Top Golf Watford</td><td>0</td><td>0.00 <span class="flat">■</span></td><td>57</td></tr>
</tbody>
</table>
</div><p><a href="index.html">Back to players</a></p>    </div>
</body>
</html>
